services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arrowell-backend
    ports:
      - "8000:8000"
    volumes:
      # Persistent DuckDB storage on host machine
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arrowell-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped